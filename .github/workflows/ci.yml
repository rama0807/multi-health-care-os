name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicore
          POSTGRES_PASSWORD: medicore
          POSTGRES_DB: medicore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate a throwaway RS256 keypair for CI
        run: |
          node -e "
            const { generateKeyPairSync } = require('crypto');
            const { privateKey, publicKey } = generateKeyPairSync('rsa', {
              modulusLength: 2048,
              publicKeyEncoding: { type: 'spki', format: 'pem' },
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            });
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_ENV, 'JWT_PRIVATE_KEY=' + Buffer.from(privateKey).toString('base64') + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'JWT_PUBLIC_KEY=' + Buffer.from(publicKey).toString('base64') + '\n');
          "

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm --filter @medicore/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://medicore:medicore@localhost:5432/medicore_test

      - name: Run API unit tests
        run: pnpm --filter @medicore/api test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://medicore:medicore@localhost:5432/medicore_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          COOKIE_SECRET: test-cookie-secret-not-for-production

      - name: Run API e2e tests
        run: pnpm --filter @medicore/api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://medicore:medicore@localhost:5432/medicore_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          COOKIE_SECRET: test-cookie-secret-not-for-production
          # The production-hardening suite asserts the metrics endpoint is
          # bearer-authenticated, so it needs a token to authenticate with.
          METRICS_TOKEN: ci-metrics-token

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --filter @medicore/web test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    # Gated on the test jobs too (Milestone 19.6). Previously `build` needed
    # only lint/typecheck, so a green "Build" could — and did — sit next to a
    # failing test suite and read as a passing pipeline.
    needs: [lint-and-typecheck, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://medicore:medicore@localhost:5432/medicore_dev

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          DATABASE_URL: postgresql://medicore:medicore@localhost:5432/medicore_dev

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/dist
          retention-days: 7

  # One job to require in branch protection. Without it, adding a job to this
  # workflow silently leaves it un-required, which is how an unenforced check
  # ends up merged around.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-and-typecheck, test-api, test-web, build]
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs did not succeed."
          exit 1
      - name: Report success
        run: echo "lint, typecheck, unit tests, e2e tests and build all passed."
