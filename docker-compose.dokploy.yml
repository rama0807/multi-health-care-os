# MediCore - production stack, Dokploy variant (ADR-0033).
#
# Same services as docker-compose.prod.yml minus `nginx`: Dokploy runs its own
# Traefik bound to the host's 80/443, terminating TLS and routing by domain,
# so a second reverse proxy publishing those same ports would fail to bind.
# Route to this stack from Dokploy's own UI instead - "Domains" tab, one
# domain for `web` (port 3000) and one for `api` (port 4000). If you also need
# nginx's rate-limiting/security-header rules, port them to Traefik middleware
# rather than reintroducing this service.
#
# Deploy from Dokploy: Compose Path = ./docker-compose.dokploy.yml, then fill
# in every ${VAR:?required} below via Dokploy's Environment tab. Everything
# else in docs/operations/deployment.md still applies (migrations are a
# separate step - see "Apply migrations, then start" - Dokploy's Deploy button
# does not run them for you).
#
# For a manually-managed VPS with your own nginx + certs, use
# docker-compose.prod.yml instead.
#
# The `version:` key is deliberately absent - Compose v2 ignores it and warns.

x-logging: &default-logging
  # Without this, container logs grow until the disk is full - the most common
  # cause of a self-inflicted outage on a single-host deployment.
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: the database is reachable only from this network.
    # Expose it deliberately and temporarily for a restore, never by default.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `--appendonly yes` matters here: Redis holds live sessions, and losing
    # them on a restart logs every user out mid-shift.
    command: >-
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      # Not consumed by redis-server itself (that gets the real password via
      # `command:` above, substituted by the Compose CLI on the host) - this
      # is so the healthcheck's `$${REDIS_PASSWORD}` has something to expand
      # inside the container's own shell, which otherwise never sees it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $${REDIS_PASSWORD} ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # RS256 keypair - `pnpm --filter @medicore/api keys:generate`.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-15m}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-30d}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Dokploy's Traefik terminates TLS and sets X-Forwarded-For; without
      # this the API would rate-limit and audit every request as coming from
      # the proxy.
      TRUST_PROXY: 'true'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-300}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-5000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    # No host port published - reachable only on Dokploy's shared network.
    # Point a Domain at this service's port 4000 in the Dokploy UI.
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `SIGTERM` starts the drain in `main.ts`; this must exceed
    # SHUTDOWN_DRAIN_MS or Docker kills the process mid-drain.
    stop_grace_period: 30s
    healthcheck:
      # Liveness, not the dependency check: a Postgres blip must not make
      # Docker restart a perfectly healthy API container.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      # Next inlines NEXT_PUBLIC_* into the client bundle at `next build` -
      # it has to reach the builder as an arg, not just container env, or
      # the browser bundle keeps whatever default the code falls back to.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    # No host port published - point a Domain at this service's port 3000.
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
