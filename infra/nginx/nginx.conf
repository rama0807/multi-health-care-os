# MediCore reverse proxy (hardened in Milestone 19.5).
#
# Changes worth knowing about if you are comparing against the previous file:
#
# - The HTTPS server block is real. TLS certificates were already being mounted
#   at /etc/nginx/ssl and port 443 was already published, but nothing listened
#   on it - the whole deployment served plain HTTP.
# - Security headers carry `always`. Without it nginx omits them on error
#   responses, which are exactly the ones an attacker is provoking.
# - `X-Request-ID` is generated when a client does not send one and passed
#   upstream, so nginx's access log and the API's structured logs quote the
#   same id for one request (Milestone 19.4).
# - The health path is `/healthz`, not `/health`, so it cannot shadow a real
#   application route.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The request id is in the log line, which is what makes an nginx 502
  # traceable into the API's own logs.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rid=$request_id_final rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  # Honour a caller-supplied id; mint one otherwise. The API validates
  # whatever arrives before it reaches a log line.
  map $http_x_request_id $request_id_final {
    default $http_x_request_id;
    ''      $request_id;
  }

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

  # Never advertise the exact nginx version.
  server_tokens off;

  # A clinical document upload is capped at 10MB by the API
  # (`@fastify/multipart`); rejecting a larger body here saves it a round trip.
  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;

  # Rate limiting. These are a coarse per-IP net in front of the API's own
  # throttling - note that a hospital LAN arrives NAT'd behind one address, so
  # both tiers are sized for a shared client, not a single user.
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  upstream api_backend {
    server api:4000;
    keepalive 32;
  }

  upstream web_frontend {
    server web:3000;
    keepalive 32;
  }

  # Shared proxy settings, so the two server blocks cannot drift apart.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id_final;
  proxy_read_timeout 60s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;

  # ── HTTP ───────────────────────────────────────────────────────────────────
  # Redirects to HTTPS, except for the health path a load balancer polls and
  # the ACME challenge a certificate renewal needs.
  server {
    listen 80;
    server_name _;

    location /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'healthy';
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers. `always` is what makes them appear on 4xx/5xx too.
    # The API sets its own on /api responses; these cover the front end.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    limit_conn conn 50;

    location /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'healthy';
    }

    # Auth endpoints - stricter, and declared before the general /api/ rule so
    # the longest matching prefix wins.
    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api_backend;
    }

    # Operational metrics are for the monitoring network, not the internet.
    # The API also requires METRICS_TOKEN; this is the second lock.
    location /api/metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://api_backend;
    }

    # Probes must answer even while the API is shedding load, so they are
    # exempt from rate limiting and kept out of the access log.
    location ~ ^/api/(v1/)?health {
      access_log off;
      proxy_pass http://api_backend;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }

    location / {
      proxy_pass http://web_frontend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }
  }
}
